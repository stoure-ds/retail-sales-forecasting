Retail Sales Time Series Forecasting

Business Problem

Retail organizations must forecast weekly sales to optimize inventory, staffing, and supply chain planning. This project builds a time series forecasting pipeline to predict future retail demand using historical Walmart sales data.

⸻

Dataset

Walmart weekly retail sales dataset
143 weeks of store-level sales aggregated into national weekly totals

Features include:
	•	Date
	•	Weekly Sales
	•	Holiday indicators
	•	Temperature
	•	Fuel price
	•	CPI
	•	Unemployment

⸻

Exploratory Insights

Sales exhibit strong yearly seasonality with pronounced holiday spikes followed by post-season corrections. Baseline demand remains stable across years, indicating predictable cyclical behavior suitable for forecasting.

⸻

Modeling Approach

Prophet time-series forecasting model was used to capture:
	•	Long-term trend
	•	Yearly seasonality
	•	Holiday effects
	•	Uncertainty intervals

A 12-week holdout test set was used for evaluation.

⸻

Results

RMSE ≈ 1.2M
Relative error ≈ 2–3% of weekly sales

This indicates strong predictive performance for operational retail planning.

⸻

Key Takeaways
	•	Retail demand follows predictable seasonal cycles
	•	Holiday spikes drive extreme variance
	•	Prophet effectively models recurring patterns
	•	Forecast uncertainty grows realistically over time

